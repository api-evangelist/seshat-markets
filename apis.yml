name: Seshat Markets
description: A public, keyless, agent-native quantitative forecasting API by Seshat providing multi-timeframe price-path
  forecasts, market/risk context, accuracy audits, and agent-intelligence signals for crypto, commodities, and pre-market
  equities. Authenticated entirely via x402 USDC micropayments on Solana and Base mainnet, with no API keys or subscriptions.
