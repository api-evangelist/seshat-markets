model: >-
  Keyless by design: x402 micropayments ARE the authentication. Paid endpoints answer HTTP
  402 with a signed payment requirement (price, USDC asset, destination, network); the
  buyer-controlled wallet signs an authorization and the client retries with the payment in
  the PAYMENT-SIGNATURE (or legacy X-PAYMENT) header. Settlement is real USDC on Solana
  mainnet (~400ms) or Base L2 (~2s) via the PayAI facilitator, using EIP-3009/Permit2 (EVM)
  or exact SVM (Solana) schemes - see /.well-known/x402 (saved in well-known/). Free
  endpoints require no credentials at all; there is no signup, no API key, and no OAuth.
